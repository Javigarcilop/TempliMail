<div class="login-fullpage">
  <div class="login-header">
    <img src="assets/TempliMail_logo_1_.png" alt="TempliMail" class="login-logo" />
    <p class="login-subtitle">Crear nueva cuenta</p>
  </div>

  <div class="login-box">
    <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="login-form">

      <!-- USUARIO -->
      <label for="nombre_usuario">Usuario</label>
      <input
        type="text"
        id="nombre_usuario"
        name="nombre_usuario"
        [(ngModel)]="nombreUsuario"
        required
      />

      <!-- CORREO -->
      <label for="correo">Correo</label>
      <input
        type="email"
        id="correo"
        name="correo"
        [(ngModel)]="correo"
        required
        email
      />

      <!-- CONTRASEÑA -->
      <label for="contrasena">Contraseña</label>
      <input
        type="password"
        id="contrasena"
        name="contrasena"
        [(ngModel)]="contrasena"
        required
        minlength="8"
      />

      <button type="submit" [disabled]="loading || registerForm.invalid">
        {{ loading ? 'Creando...' : 'Registrarse' }}
      </button>

      <p class="register-link">
        ¿Ya tienes cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>

      <p
      *ngIf="message"
      [ngClass]="{
        'text-danger': isError,
        'text-success': !isError
      }"
    >
      {{ message }}
    </p>
    
    </form>
  </div>
</div>
