<h2>Enviar Email</h2>

<form (ngSubmit)="onSubmit(mailForm)" #mailForm="ngForm">

  <label for="destinatario">Destinatario:</label>
  <input
    type="email"
    id="destinatario"
    name="destinatario"
    [(ngModel)]="destinatario"
    required
  />

  <br /><br />

  <label for="asunto">Asunto:</label>
  <input
    type="text"
    id="asunto"
    name="asunto"
    [(ngModel)]="asunto"
    required
  />

  <!-- Generador de asuntos con IA -->
  <div class="ai-box">
    <div class="ai-input-row">
      <input
        type="text"
        class="ai-topic-input"
        placeholder="Describe el tema del correo..."
        [(ngModel)]="aiTopic"
        name="aiTopic"
        [ngModelOptions]="{ standalone: true }"
        (keyup.enter)="suggestSubjects()"
        maxlength="300"
      />
      <button
        type="button"
        class="ai-btn"
        (click)="suggestSubjects()"
        [disabled]="aiLoading || !aiTopic.trim()"
      >
        {{ aiLoading ? 'Generando...' : '✨ Sugerir asunto' }}
      </button>
    </div>

    <p class="ai-error" *ngIf="aiError">{{ aiError }}</p>

    <div class="ai-suggestions" *ngIf="aiSuggestions.length > 0">
      <span class="ai-suggestions-label">Elige un asunto:</span>
      <button
        type="button"
        class="suggestion-chip"
        *ngFor="let s of aiSuggestions"
        (click)="selectSuggestion(s)"
      >
        {{ s }}
      </button>
    </div>
  </div>

  <br />

  <label for="cuerpo">Mensaje:</label>
  <br />

  <editor
    [apiKey]="tinymceApiKey"
    [licenseKey]="tinymceLicenseKey"
    [(ngModel)]="cuerpo"
    name="cuerpo"
    required
    [ngModelOptions]="{ standalone: true }"
    [init]="{
      height: 300,
      menubar: false,
      plugins: 'advlist autolink lists link charmap preview anchor code',
      toolbar: 'undo redo | bold italic underline | bullist numlist | link | code'
    }">
  </editor>

  <br />

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Enviando...' : 'Enviar' }}
  </button>

</form>
