<div class="login-fullpage">
  <div class="login-header">
    <img src="assets/TempliMail_logo_1_.png" alt="TempliMail" class="login-logo" />
    <p class="login-subtitle">Tu solución profesional de email marketing</p>
  </div>

  <div class="login-box">
    <p class="demo-note" *ngIf="demo">Demo con datos simulados. Pulsa «Iniciar sesión» para entrar.</p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">

      <label for="nombre_usuario">Usuario</label>
      <input
        type="text"
        id="nombre_usuario"
        name="nombre_usuario"
        [(ngModel)]="nombreUsuario"
        required
      />

      <label for="contrasena">Contraseña</label>
      <input
        type="password"
        id="contrasena"
        name="contrasena"
        [(ngModel)]="contrasena"
        required
      />

      @if (infoMessage) {
        <p class="form-message info" role="status">{{ infoMessage }}</p>
      }

      @if (errorMessage) {
        <p class="form-message error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
      </button>

      <p class="register-link">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate</a>
      </p>

    </form>
  </div>
</div>
