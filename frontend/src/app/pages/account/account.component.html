<div class="account-wrapper">

  <h2>Mi cuenta</h2>

  <section class="card">
    <h3>Datos personales</h3>

    <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
      <label for="nombre_usuario">Usuario</label>
      <input id="nombre_usuario" type="text" [value]="nombreUsuario" disabled />

      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" required [(ngModel)]="correo" />

      <button type="submit" [disabled]="profileForm.invalid || guardandoPerfil">
        {{ guardandoPerfil ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </section>

  <section class="card">
    <h3>Cambiar contraseña</h3>

    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <label for="actual">Contraseña actual</label>
      <input id="actual" name="actual" type="password" required autocomplete="current-password" [(ngModel)]="contrasenaActual" />

      <label for="nueva">Nueva contraseña</label>
      <input id="nueva" name="nueva" type="password" required [minlength]="longitudMinimaContrasena" autocomplete="new-password" [(ngModel)]="contrasenaNueva" />
      <small>Mínimo {{ longitudMinimaContrasena }} caracteres.</small>

      <label for="confirmar">Repite la nueva contraseña</label>
      <input id="confirmar" name="confirmar" type="password" required autocomplete="new-password" [(ngModel)]="confirmarContrasena" />

      @if (errorContrasena) {
        <p class="form-error" role="alert">{{ errorContrasena }}</p>
      }

      <button type="submit" [disabled]="passwordForm.invalid || guardandoContrasena">
        {{ guardandoContrasena ? 'Cambiando...' : 'Cambiar contraseña' }}
      </button>
    </form>

    <p class="note">Al cambiar la contraseña se cerrarán las sesiones abiertas en otros dispositivos.</p>
  </section>

</div>
