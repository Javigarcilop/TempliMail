<div class="account-wrapper">

  <h2>Mi cuenta</h2>

  <section class="card">
    <h3>Datos personales</h3>

    <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
      <label for="username">Usuario</label>
      <input id="username" type="text" [value]="username" disabled />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required [(ngModel)]="email" />

      <button type="submit" [disabled]="profileForm.invalid || savingProfile">
        {{ savingProfile ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  </section>

  <section class="card">
    <h3>Cambiar contraseña</h3>

    <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
      <label for="current">Contraseña actual</label>
      <input id="current" name="current" type="password" required autocomplete="current-password" [(ngModel)]="currentPassword" />

      <label for="new">Nueva contraseña</label>
      <input id="new" name="new" type="password" required [minlength]="minPasswordLength" autocomplete="new-password" [(ngModel)]="newPassword" />
      <small>Mínimo {{ minPasswordLength }} caracteres.</small>

      <label for="confirm">Repite la nueva contraseña</label>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password" [(ngModel)]="confirmPassword" />

      @if (passwordError) {
        <p class="form-error" role="alert">{{ passwordError }}</p>
      }

      <button type="submit" [disabled]="passwordForm.invalid || savingPassword">
        {{ savingPassword ? 'Cambiando...' : 'Cambiar contraseña' }}
      </button>
    </form>

    <p class="note">Al cambiar la contraseña se cerrarán las sesiones abiertas en otros dispositivos.</p>
  </section>

</div>
