services:
  # API PHP (Apache)  ->  http://localhost:8080/backend/api/index.php
  backend:
    build: ./backend
    image: templimail-backend
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # Worker de envio: procesa la cola de campanas (inmediatas y programadas).
  # Sin el, las campanas se quedan en "En cola".
  worker:
    build: ./backend
    image: templimail-backend
    command: php backend/bin/worker.php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: templimail_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecutan la primera vez (volumen vacio)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db

  # Buzon de pruebas (opcional): captura los correos en vez de enviarlos.
  #   docker compose --profile dev up -d mailpit
  # y en backend/.env:  SMTP_HOST=mailpit  SMTP_PORT=1025  SMTP_SECURE=none
  # (SMTP_USER y SMTP_PASSWORD vacios). Bandeja: http://localhost:8025
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  # Frontend Angular (opcional):  docker compose --profile frontend up -d
  # Si prefieres ejecutarlo en Windows: cd frontend && npm start
  frontend:
    profiles: ["frontend"]
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  frontend_node_modules:
