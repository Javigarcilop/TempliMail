# El repositorio completo se monta en /var/www/html (.env, codigo, SQL...).
# Solo la carpeta de la API debe ser accesible desde el navegador.
<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html/backend/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Defensa adicional: nunca servir ficheros ocultos ni de configuracion
<FilesMatch "^\.(env|git)|\.(sql|md|lock|json|zip)$">
    Require all denied
</FilesMatch>
